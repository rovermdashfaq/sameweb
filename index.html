<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Cloner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🌐 Website Cloner (Education Only)</h1>
  
  <div class="container">
    <input type="text" id="urlInput" placeholder="Enter website URL (e.g. https://example.com)">
    
    <div class="actions">
      <button onclick="cloneWebsite()">Clone Website</button>
      <button onclick="downloadCode()">Download HTML</button>
      <button onclick="toggleTheme()">🌙/☀️</button>
    </div>

    <h2>HTML Code:</h2>
    <pre id="output">Website HTML will appear here...</pre>
    
    <h2>Live Preview:</h2>
    <iframe id="preview"></iframe>
  </div>

  <script src="script.js"></script>
</body>
</html>
